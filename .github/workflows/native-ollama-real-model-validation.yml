name: Native macOS Ollama real-model validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-ollama-real-model-validation.yml'
      - 'build/build-native-package.py'
      - 'build/build-unix-profile.py'
      - 'src/unix/install.sh'
      - 'tests/unix-ollama-e2e.sh'

concurrency:
  group: native-ollama-real-model-validation
  cancel-in-progress: true

jobs:
  real-model:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            profile: macos-ollama-qwen3-1.7b
            model: qwen3:1.7b
            install_folder: qwen3-1.7b
            port: 11541
          - os: macos-latest
            platform: macos
            profile: macos-ollama-qwen3-4b
            model: qwen3:4b
            install_folder: qwen3-4b
            port: 11544
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Run full native install with production model
        shell: bash
        env:
          ANTIGRAVITY_E2E_MODEL: ${{ matrix.model }}
          ANTIGRAVITY_TEST_PORT: ${{ matrix.port }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            export ANTIGRAVITY_E2E_INSTALL_ROOT="$HOME/Library/Application Support/AntigravityLocal/${{ matrix.install_folder }}"
          fi
          bash tests/unix-ollama-e2e.sh "${{ matrix.profile }}"

      - name: Build native package with CI-only RAM preflight override
        shell: bash
        run: python3 build/build-native-package.py --profile-id "${{ matrix.profile }}" --platform "${{ matrix.platform }}" --output-dir dist/native-real --ci-min-ram-gb 1

      - name: Execute final macOS pkg against the validated private install
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          pkg="dist/native-real/${{ matrix.profile }}.pkg"
          test -s "$pkg"
          pkgutil --payload-files "$pkg" | grep -q 'install.sh'
          install_root="$HOME/Library/Application Support/AntigravityLocal/${{ matrix.install_folder }}"
          state="$install_root/install-state.json"
          install_log="$HOME/Library/Logs/AntigravityLocal/${{ matrix.profile }}-install.log"
          result_file="$HOME/Library/Logs/AntigravityLocal/${{ matrix.profile }}-install.exit"

          # The direct native E2E above proves the engine/model path. Remove it before
          # installing the final package so the package must succeed from a clean
          # per-profile customer state instead of reusing runtime/model files.
          rm -rf "$install_root"
          rm -f "$install_log" "$result_file"

          if ! sudo installer -pkg "$pkg" -target /; then
            echo "===== Antigravity postinstall log ====="
            sudo cat /var/tmp/antigravity-local-postinstall.log 2>/dev/null || true
            echo "===== macOS installer log tail ====="
            sudo tail -n 250 /var/log/install.log 2>/dev/null || true
            exit 1
          fi

          for _ in $(seq 1 210); do
            if [ -f "$result_file" ]; then
              break
            fi
            sleep 10
          done

          if [ ! -f "$result_file" ]; then
            echo "Background package installation did not finish within the validation window."
            cat "$install_log" 2>/dev/null || true
            exit 1
          fi

          result="$(cat "$result_file")"
          if [ "$result" != "0" ]; then
            echo "Background package installation failed with exit code $result."
            cat "$install_log" 2>/dev/null || true
            exit 1
          fi

          test -f "$state"
          echo "===== Final package background install log tail ====="
          tail -n 120 "$install_log" 2>/dev/null || true
          PROFILE="${{ matrix.profile }}" MODEL="${{ matrix.model }}" python3 - "$state" <<'PY'
          import json,os,sys
          data=json.load(open(sys.argv[1]))
          assert data["profile"]==os.environ["PROFILE"], data
          assert data["model"]==os.environ["MODEL"], data
          print("FINAL MACOS PKG PASSED:", data["profile"], data["model"])
          PY
