name: Native macOS and Linux installer E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/unix/**'
      - 'src/_internal/pack.json'
      - 'src/_internal/local_agent.py'
      - 'src/_internal/litert_agent.py'
      - 'build/build-unix-profile.py'
      - 'build/build-native-package.py'
      - 'tests/unix-ollama-e2e.sh'
      - 'tests/unix-litert-e2e.sh'
      - '.github/workflows/native-unix-e2e.yml'

concurrency:
  group: native-unix-e2e-main
  cancel-in-progress: true

jobs:
  linux-ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Run Linux Ollama production engine with small checkpoint
        shell: bash
        env:
          ANTIGRAVITY_E2E_MODEL: qwen3:0.6b
        run: bash tests/unix-ollama-e2e.sh "linux-ollama-gemma4-e2b"

      - name: Build Linux candidate package
        shell: bash
        run: python3 build/build-native-package.py --profile-id "linux-ollama-gemma4-e2b" --platform linux --output-dir dist/native

      - name: Verify Linux self-extracting package
        shell: bash
        run: |
          test -s "dist/native/linux-ollama-gemma4-e2b.run"
          grep -a -q '^__ANTIGRAVITY_PAYLOAD_BELOW__$' "dist/native/linux-ollama-gemma4-e2b.run"

  linux-litert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run Linux LiteRT production engine with small checkpoint
        shell: bash
        run: bash tests/unix-litert-e2e.sh "linux-litert-gemma4-26b"

      - name: Build Linux LiteRT candidate package
        shell: bash
        run: python3 build/build-native-package.py --profile-id "linux-litert-gemma4-26b" --platform linux --output-dir dist/native

      - name: Verify Linux LiteRT self-extracting package
        shell: bash
        run: |
          test -s "dist/native/linux-litert-gemma4-26b.run"
          grep -a -q '^__ANTIGRAVITY_PAYLOAD_BELOW__$' "dist/native/linux-litert-gemma4-26b.run"

  macos-ollama:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: macos-ollama-qwen3-1.7b
          - profile: macos-ollama-qwen3-4b
    steps:
      - uses: actions/checkout@v4

      - name: Run macOS Ollama production engine with small checkpoint
        shell: bash
        env:
          ANTIGRAVITY_E2E_MODEL: qwen3:0.6b
        run: bash tests/unix-ollama-e2e.sh "${{ matrix.profile }}"

      - name: Build macOS candidate package
        shell: bash
        run: python3 build/build-native-package.py --profile-id "${{ matrix.profile }}" --platform macos --output-dir dist/native

      - name: Verify macOS package
        shell: bash
        run: |
          test -s "dist/native/${{ matrix.profile }}.pkg"
          pkgutil --payload-files "dist/native/${{ matrix.profile }}.pkg" | grep -q 'install.sh'

  macos-litert:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run macOS LiteRT production engine with small checkpoint
        shell: bash
        run: bash tests/unix-litert-e2e.sh "macos-litert-gemma4-26b"

      - name: Build macOS LiteRT candidate package
        shell: bash
        run: python3 build/build-native-package.py --profile-id "macos-litert-gemma4-26b" --platform macos --output-dir dist/native

      - name: Verify macOS LiteRT package
        shell: bash
        run: |
          test -s "dist/native/macos-litert-gemma4-26b.pkg"
          pkgutil --payload-files "dist/native/macos-litert-gemma4-26b.pkg" | grep -q 'install.sh'
