name: Cross-platform installer release catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/_internal/pack.json'
      - 'catalog/package-routing.json'
      - 'catalog/site-hardware-options.json'
      - 'src/unix/**'
      - 'src/_internal/local_agent.py'
      - 'src/_internal/litert_agent.py'
      - 'build/build-profile.ps1'
      - 'build/build-all-profiles.ps1'
      - 'build/build-unix-profile.py'
      - 'build/build-native-package.py'
      - 'build/build-native-release.py'
      - 'build/merge-release-catalog.py'
      - 'build/generate-site-routing.ps1'
      - 'build/generate-download-manifest.py'
      - 'tests/release-catalog.py'
      - '.github/workflows/cross-platform-release.yml'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      macos_count: ${{ steps.counts.outputs.macos_count }}
    steps:
      - uses: actions/checkout@v4
      - id: counts
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open("src/_internal/pack.json"))
          count=sum(
              1 for p in data["profiles"]
              if p.get("platform")=="macos" and p.get("verified") is True and p.get("release",True) is True
          )
          print("macos_count="+str(count))
          PY

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build released Windows profiles
        shell: powershell
        run: |
          .\build\build-all-profiles.ps1
          Copy-Item dist\installer-catalog.json dist\platform-catalog-windows.json -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/platform-catalog-windows.json
            dist/profiles/*.exe
          if-no-files-found: error

  macos:
    needs: [plan]
    runs-on: ${{ needs.plan.outputs.macos_count == '0' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build released macOS profiles
        run: python3 build/build-native-release.py --platform macos --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/platform-catalog-macos.json
            dist/profiles/*.pkg
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build released Linux profiles
        run: python3 build/build-native-release.py --platform linux --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/platform-catalog-linux.json
            dist/profiles/*.run
          if-no-files-found: warn

  aggregate:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: collected
      - name: Merge platform catalogs
        shell: bash
        run: |
          python3 build/merge-release-catalog.py \
            --catalog collected/release-windows/platform-catalog-windows.json \
            --catalog collected/release-macos/platform-catalog-macos.json \
            --catalog collected/release-linux/platform-catalog-linux.json \
            --output dist/installer-catalog.json
      - name: Generate website routing
        shell: pwsh
        run: ./build/generate-site-routing.ps1
      - name: Verify every released website route has a package
        shell: bash
        run: python3 tests/release-catalog.py --catalog dist/installer-catalog.json --routing dist/site-installer-routing.json
      - name: Generate website download manifest
        shell: bash
        run: python3 build/generate-download-manifest.py --catalog dist/installer-catalog.json --routing dist/site-installer-routing.json --output dist/site-download-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: global-installer-release-catalog
          path: |
            dist/installer-catalog.json
            dist/site-installer-routing.json
            dist/site-installer-coverage.json
            dist/installer-work-queue.json
            dist/site-download-manifest.json
          if-no-files-found: error
