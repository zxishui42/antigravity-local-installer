name: Windows installer CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-ci:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Windows installer regression tests
        shell: powershell
        run: .\tests\windows-ci.ps1

      - name: Build compiled installed app
        shell: powershell
        run: .\\build\\build-app.ps1

      - name: Run real Windows Ollama integration
        shell: powershell
        run: .\\tests\\windows-integration.ps1

      - name: Run production worker recovery and reinstall test
        shell: powershell
        run: .\\tests\\windows-endtoend.ps1

      - name: Build single-file Windows installer
        shell: powershell
        run: .\\build\\build-bootstrapper.ps1

      - name: Self-test single-file Windows installer
        shell: powershell
        run: .\\tests\\bootstrapper-selftest.ps1

      - name: Upload Windows-tested package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-local-windows-e2b-tested
          path: dist/AntigravityLocalSetup.exe
          if-no-files-found: error
