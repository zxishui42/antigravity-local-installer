name: Windows installer CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-ci:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Windows installer regression tests
        shell: powershell
        run: .\tests\windows-ci.ps1

      - name: Upload tested source bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-installer-source
          path: installer-source.zip
