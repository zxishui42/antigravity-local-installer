name: Quick source check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quick-source-check-main
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all PowerShell source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'src/_internal/worker.ps1',
            'src/_internal/installer.ps1',
            'build/prepare.ps1',
            'build/build-profile.ps1',
            'build/build-all-profiles.ps1',
            'build/generate-site-routing.ps1',
            'tests/windows-ci.ps1',
            'tests/profile-catalog.ps1',
            'tests/profile-model-validation.ps1',
            'tests/litert-windows-preflight.ps1',
            'tests/windows-litert-endtoend.ps1'
          )
          foreach($file in $files){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              $detail=($errors | ForEach-Object { ('line '+$_.Extent.StartLineNumber+' near ['+$_.Extent.Text+']: '+$_.Message) }) -join '; '
              throw "$file parse errors: $detail"
            }
            Write-Host "PARSE OK: $file"
          }

      - name: Validate JSON catalogs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('src/_internal/pack.json','catalog/site-hardware-options.json','catalog/package-routing.json')){
            $null=Get-Content $file -Raw | ConvertFrom-Json
            Write-Host "JSON OK: $file"
          }

      - name: Compile Python agent templates
        shell: bash
        run: |
          python -m py_compile src/_internal/local_agent.py
          python -m py_compile src/_internal/litert_agent.py

      - name: Check native shell scripts
        shell: bash
        run: |
          bash -n src/unix/install.sh
          bash -n tests/unix-ollama-e2e.sh
          bash -n tests/unix-litert-e2e.sh

      - name: Compile native package builders
        shell: bash
        run: |
          python -m py_compile build/build-unix-profile.py
          python -m py_compile build/build-native-package.py
          python -m py_compile build/build-native-release.py
          python -m py_compile build/merge-release-catalog.py
          python -m py_compile build/generate-download-manifest.py
          python -m py_compile build/promote-profile.py
          python -m py_compile tests/release-catalog.py

      - name: Check website installer resolver
        shell: bash
        run: |
          node --check web/installer-resolver.js
          node tests/installer-resolver.mjs
